<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Nihad Musa">
  <defs>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8b949e" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#8b949e" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="lineGlow" x="-30%" y="-400%" width="160%" height="900%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#30363d"/>
    </pattern>

    <style>
      .bg   { fill: #0d1117; }
      .bd   { fill: none; stroke: #21262d; stroke-width: 1.2; }
      .t1   { fill: #e6edf3; }
      .t2   { fill: #8b949e; }
      .t3   { fill: #6e7681; }
      .accent { fill: #c9d1d9; }

      @keyframes breathe { 0%,100% { opacity: .93 } 50% { opacity: 1 } }
      @keyframes pulse   { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
      @keyframes haloDrift {
        0%   { transform: translateX(-120px); }
        100% { transform: translateX(120px); }
      }
      .breathe { animation: breathe 9s ease-in-out infinite; }
      .pulse   { animation: pulse 4s ease-in-out infinite; }
      .halo    { animation: haloDrift 14s ease-in-out infinite alternate; }

      @media (prefers-color-scheme: light) {
        .bg   { fill: #ffffff; }
        .bd   { stroke: #d0d7de; }
        .t1   { fill: #1f2328; }
        .t2   { fill: #59636e; }
        .t3   { fill: #818b98; }
        .accent { fill: #32383f; }
      }

      @media (prefers-reduced-motion: reduce) {
        .breathe, .pulse, .halo { animation: none; }
        .shine { display: none; }
      }
    </style>
  </defs>

  <rect class="bg" width="1000" height="250"/>
  <rect class="bd" x="0.6" y="0.6" width="998.8" height="248.8"/>

  <!-- faint static dot grid -->
  <rect x="0" y="0" width="1000" height="250" fill="url(#dots)" opacity=".55"/>
  <ellipse class="halo" cx="500" cy="110" rx="420" ry="150" fill="url(#halo)"/>

  <!-- name -->
  <g class="breathe">
    <text x="500" y="140" text-anchor="middle"
          font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          font-size="74" font-weight="700" letter-spacing="3"
          class="t1" filter="url(#softGlow)">Nihad Musa</text>
  </g>

  <!-- role -->
  <text x="500" y="176" text-anchor="middle"
        font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="18" letter-spacing="4" class="t2">JAVA BACKEND DEVELOPER</text>

  <!-- hairline + slow shimmer -->
  <g filter="url(#lineGlow)">
    <rect x="330" y="198" width="340" height="1.2" rx="0.6" fill="url(#hairGrad)"/>
    <rect class="shine" x="330" y="197" width="72" height="2.4" rx="1.2" fill="url(#shineGrad)">
      <animate attributeName="x" from="296" to="632" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- status -->
  <g transform="translate(500 226)">
    <circle cx="-58" cy="0" r="3.2" class="accent pulse"/>
    <text x="-44" y="5" font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
          font-size="13" letter-spacing="3" class="t3">OPEN TO WORK</text>
  </g>
</svg>
