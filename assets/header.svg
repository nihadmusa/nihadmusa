<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Nihad Musayev">
  <defs>
    <radialGradient id="b1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#818cf8" stop-opacity=".50"/>
      <stop offset="42%"  stop-color="#818cf8" stop-opacity=".22"/>
      <stop offset="72%"  stop-color="#818cf8" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="b2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity=".44"/>
      <stop offset="45%"  stop-color="#6366f1" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="b3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity=".30"/>
      <stop offset="48%"  stop-color="#a78bfa" stop-opacity=".11"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="underGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#818cf8" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c7d2fe" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#e0e7ff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0"/>
    </linearGradient>

    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="nameGlow" x="-30%" y="-70%" width="160%" height="240%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="lineGlow" x="-30%" y="-500%" width="160%" height="1100%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .bg   { fill: #0a0a0f; }
      .bd   { fill: none; stroke: #ffffff; stroke-opacity: .06; stroke-width: 1; }
      .name { fill: #f8fafc; }
      .role { fill: #c7d2fe; }
      .t3   { fill: #64748b; }

      @keyframes drift1 { 0% { transform: translate(0,0) }        100% { transform: translate(72px,38px) } }
      @keyframes drift2 { 0% { transform: translate(0,0) }        100% { transform: translate(-64px,-30px) } }
      @keyframes drift3 { 0% { transform: translate(0,0) scale(1) } 100% { transform: translate(-42px,46px) scale(1.14) } }
      @keyframes shimmer { 0% { opacity: .25 } 45% { opacity: 1 } 100% { opacity: .25 } }
      @keyframes pulse  { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

      .blob1 { animation: drift1 34s ease-in-out infinite alternate; }
      .blob2 { animation: drift2 42s ease-in-out infinite alternate; }
      .blob3 { animation: drift3 38s ease-in-out infinite alternate; }
      .shine { animation: shimmer 9s ease-in-out infinite; }
      .dot   { animation: pulse 5s ease-in-out infinite; }

      @media (prefers-color-scheme: light) {
        .bg    { fill: #f7f8fd; }
        .bd    { stroke: #0f172a; stroke-opacity: .08; }
        .name  { fill: #13151c; }
        .role  { fill: #4f46e5; }
        .t3    { fill: #64748b; }
        .blob1 { opacity: .55; }
        .blob2 { opacity: .5; }
        .blob3 { opacity: .5; }
      }

      @media (prefers-reduced-motion: reduce) {
        .blob1, .blob2, .blob3, .shine, .dot { animation: none; }
        .shine { display: none; }
      }
    </style>
  </defs>

  <!-- aurora field -->
  <rect class="bg" width="1000" height="280"/>
  <ellipse class="blob1" cx="290" cy="86"  rx="360" ry="220" fill="url(#b1)"/>
  <ellipse class="blob2" cx="770" cy="212" rx="320" ry="200" fill="url(#b2)"/>
  <ellipse class="blob3" cx="560" cy="34"  rx="280" ry="160" fill="url(#b3)"/>

  <!-- grain kills gradient banding -->
  <rect width="1000" height="280" filter="url(#grain)" opacity="0.022"/>

  <!-- name -->
  <text x="500" y="140" text-anchor="middle"
        font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="70" font-weight="700" letter-spacing="2"
        class="name" filter="url(#nameGlow)">Nihad Musayev</text>

  <!-- role -->
  <text x="500" y="176" text-anchor="middle"
        font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="17" letter-spacing="5" class="role">SOFTWARE DEVELOPER</text>

  <!-- accent underline + shimmer -->
  <g filter="url(#lineGlow)">
    <rect x="430" y="194" width="140" height="1.6" rx="0.8" fill="url(#underGrad)"/>
    <rect class="shine" x="430" y="193" width="48" height="2.8" rx="1.4" fill="url(#shineGrad)">
      <animate attributeName="x" from="420" to="546" dur="30s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- status -->
  <g transform="translate(500 226)">
    <circle cx="-66" cy="0" r="3" fill="#818cf8" class="dot"/>
    <text x="-52" y="4.5" font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
          font-size="12.5" letter-spacing="3" class="t3">OPEN TO WORK</text>
  </g>

  <rect class="bd" x="0.5" y="0.5" width="999" height="279"/>
</svg>
