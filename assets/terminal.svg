<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" width="720" height="396" role="img" aria-label="Code sample">
  <defs>
    <filter id="glowT" x="-60%" y="-120%" width="220%" height="340%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .bg   { fill: #0d0d14; }
      .bar  { fill: #14141f; }
      .bd   { fill: none; stroke: #818cf8; stroke-opacity: .22; stroke-width: 1.2; }
      .sep  { stroke: #2a2a3d; stroke-width: 1; }
      .num  { fill: #4b5563; }
      .code { fill: #cbd5e1; }
      .kw   { fill: #f1f5f9; font-weight: 600; }
      .anno { fill: #94a3b8; font-style: italic; }
      .dot  { fill: #3f3f56; }
      .ttl  { fill: #64748b; }
      .cur  { fill: #818cf8; }

      /* each group owns a 3.5s window of the 14s loop.
         negative delays keep the stagger permanent across loops. */
      @keyframes reveal {
        0%     { opacity: 0; }
        1.5%   { opacity: 1; }
        23.5%  { opacity: 1; }
        25%    { opacity: 0; }
        100%   { opacity: 0; }
      }
      @keyframes caretBreath { 0%,100% { opacity: .65 } 50% { opacity: 1 } }

      .g1 { animation: reveal 20s linear infinite;            animation-delay: 0; }
      .g2 { animation: reveal 20s linear infinite;            animation-delay: -5s; }
      .g3 { animation: reveal 20s linear infinite;            animation-delay: -10s; }
      .g4 { animation: reveal 20s linear infinite;            animation-delay: -15s; }
      .cb { animation: caretBreath 2.8s ease-in-out infinite; }

      @media (prefers-color-scheme: light) {
        .bg   { fill: #ffffff; }
        .bar  { fill: #f7f8fc; }
        .bd   { stroke: #6366f1; stroke-opacity: .3; }
        .sep  { stroke: #d9dce8; }
        .num  { fill: #7c8798; }
        .code { fill: #12141b; }
        .kw   { fill: #0f1117; }
        .anno { fill: #5b6472; }
        .dot  { fill: #a8b3c4; }
        .ttl  { fill: #7b8494; }
        .cur  { fill: #4f46e5; }
      }

      @media (prefers-reduced-motion: reduce) {
        .g1, .g2, .g3, .g4 { animation: none; opacity: 1; }
        .cb { animation: none; }
      }
    </style>
  </defs>

  <rect class="bg" width="720" height="396" rx="14"/>
  <rect class="bd" x="0.6" y="0.6" width="718.8" height="394.8" rx="14"/>

  <!-- title bar -->
  <path class="bar" d="M14 0 h692 a14 14 0 0 1 14 14 v26 h-720 v-26 a14 14 0 0 1 14 -14 z"/>
  <circle class="dot" cx="26" cy="20" r="4"/>
  <circle class="dot" cx="42" cy="20" r="4"/>
  <circle class="dot" cx="58" cy="20" r="4"/>
  <text x="360" y="25" text-anchor="middle" class="ttl"
        font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="12.5" letter-spacing="1.2">OrderController.java</text>
  <line class="sep" x1="0" y1="40" x2="720" y2="40"/>

  <!-- code: every group is one frame of the build-up -->
  <g font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="15">

    <g>
      <text x="24" y="70" class="num">1</text>
      <text x="62" y="70" class="anno">@RestController</text>
      <text x="24" y="96" class="num">2</text>
      <text x="62" y="96" class="anno">@RequestMapping("/api/v1/orders")</text>
    </g>

    <g class="g1">
      <text x="24" y="122" class="num">3</text>
      <text x="62" y="122"><tspan class="kw">public class</tspan><tspan class="code"> </tspan><tspan class="code">OrderController</tspan><tspan class="code"> {</tspan></text>
      <text x="24" y="148" class="num">4</text>
      <text x="62" y="148" class="code">    </text>
      <text x="24" y="174" class="num">5</text>
      <text x="62" y="174"><tspan class="kw">private final</tspan><tspan class="code"> </tspan><tspan class="code">OrderService</tspan><tspan class="code"> service;</tspan></text>
      <text x="24" y="200" class="num">6</text>
      <text x="62" y="200" class="code">    </text>
    </g>

    <g class="g2">
      <text x="24" y="226" class="num">7</text>
      <text x="62" y="226" class="anno">@GetMapping("/{id}")</text>
      <text x="24" y="252" class="num">8</text>
      <text x="62" y="252"><tspan class="kw">public</tspan><tspan class="code"> </tspan><tspan class="code">ResponseEntity</tspan><tspan class="code">&lt;</tspan><tspan class="code">Order</tspan><tspan class="code">&gt; </tspan><tspan class="code">byId(</tspan><tspan class="anno">@PathVariable</tspan><tspan class="code"> </tspan><tspan class="code">UUID id) {</tspan></text>
    </g>

    <g class="g3">
      <text x="24" y="278" class="num">9</text>
      <text x="62" y="278"><tspan class="kw">return</tspan><tspan class="code"> service.</tspan><tspan class="code">find</tspan><tspan class="code">(id)</tspan></text>
      <text x="40" y="304" class="num">10</text>
      <text x="78" y="304"><tspan class="code">      .</tspan><tspan class="code">map</tspan><tspan class="code">(</tspan><tspan class="code">ResponseEntity</tspan><tspan class="code">::ok)</tspan></text>
      <text x="40" y="330" class="num">11</text>
      <text x="78" y="330"><tspan class="code">      .</tspan><tspan class="code">orElseGet</tspan><tspan class="code">(() -&gt; </tspan><tspan class="code">ResponseEntity</tspan><tspan class="code">.</tspan><tspan class="code">notFound</tspan><tspan class="code">().</tspan><tspan class="code">build</tspan><tspan class="code">());</tspan></text>
    </g>

    <g class="g4">
      <text x="24" y="356" class="num">12</text>
      <text x="62" y="356" class="code">}</text>
      <rect class="cur cb" x="72" y="343" width="8.5" height="17" rx="1" filter="url(#glowT)"/>
      <text x="24" y="382" class="num">13</text>
      <text x="62" y="382" class="code">}</text>
    </g>
  </g>
</svg>
