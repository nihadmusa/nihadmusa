<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="code">
  <defs>
    <linearGradient id="kg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2bd6"/><stop offset="100%" stop-color="#00eaff"/>
    </linearGradient>
    <filter id="kf" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes fl3 { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2.5px) } }
      @keyframes draw { 0% { stroke-dashoffset: 60 } 55%,100% { stroke-dashoffset: 0 } }
    </style>
  </defs>
  <g style="animation:fl3 3.2s ease-in-out infinite;">
    <g fill="none" stroke="url(#kg)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"
       stroke-dasharray="60" filter="url(#kf)" style="animation:draw 4s ease-in-out infinite;">
      <polyline points="23,21 10,32 23,43"/>
      <polyline points="41,21 54,32 41,43"/>
    </g>
    <line x1="36" y1="17" x2="28" y2="47" stroke="#ffd166" stroke-width="2.4" stroke-linecap="round" filter="url(#kf)">
      <animate attributeName="opacity" values=".45;1;.45" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <circle cx="32" cy="32" r="26" fill="none" stroke="#7a5cff" stroke-width="1" stroke-dasharray="3 9" opacity="0.65"/>
  </g>
</svg>
