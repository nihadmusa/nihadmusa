<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="contact">
  <defs>
    <filter id="ig" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .s   { fill: none; stroke: #818cf8; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1.6px) } }
      .g { animation: float 8.8s ease-in-out infinite; }
      @media (prefers-color-scheme: light) { .s { stroke: #4f46e5 } }
      @media (prefers-reduced-motion: reduce) { .g { animation: none } }
    </style>
  </defs>
  <g class="g" filter="url(#ig)">
    <rect class="s" x="9" y="17" width="46" height="30" rx="6"/>
    <polyline class="s" points="12,21 32,36 52,21" stroke-width="1.5"/>
    <path class="s" d="M12 43 L25 32" stroke-width="1.3" opacity=".5"/>
    <path class="s" d="M52 43 L39 32" stroke-width="1.3" opacity=".5"/>
  </g>
</svg>
