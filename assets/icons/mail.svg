<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="mail">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00eaff"/><stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="mf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes fl5 { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2.5px) } }
      @keyframes blip { 0%,100% { opacity:.25 } 50% { opacity:1 } }
    </style>
  </defs>
  <g style="animation:fl5 3.3s ease-in-out infinite;">
    <rect x="8" y="16" width="48" height="32" rx="7" fill="none" stroke="url(#mg)" stroke-width="2.6" filter="url(#mf)"/>
    <polyline points="11,20 32,36 53,20" fill="none" stroke="#7ae0ff" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round" filter="url(#mf)"/>
    <polyline points="11,45 26,32" fill="none" stroke="#b14aff" stroke-width="1.8" opacity="0.8"/>
    <polyline points="53,45 38,32" fill="none" stroke="#b14aff" stroke-width="1.8" opacity="0.8"/>
    <circle cx="53" cy="20" r="4" fill="#ffd166" filter="url(#mf)" style="animation:blip 1.4s ease-in-out infinite;">
      <animate attributeName="r" values="3;6;3" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
