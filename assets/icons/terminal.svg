<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="terminal">
  <defs>
    <filter id="ig" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .s   { fill: none; stroke: #c9d1d9; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .f   { fill: #c9d1d9; }
      .dim { fill: #484f58; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1.6px) } }
      .g { animation: float 6s ease-in-out infinite; }
      @media (prefers-color-scheme: light) {
        .s { stroke: #32383f } .f { fill: #32383f } .dim { fill: #afb8c1 }
      }
      @media (prefers-reduced-motion: reduce) { .g { animation: none } }
    </style>
  </defs>
  <g class="g" filter="url(#ig)">
    <rect class="s" x="8" y="14" width="48" height="36" rx="7"/>
    <line class="s" x1="8" y1="24" x2="56" y2="24" stroke-width="1.2"/>
    <circle class="dim" cx="16" cy="19" r="1.6"/>
    <circle class="dim" cx="23" cy="19" r="1.6"/>
    <polyline class="s" points="17,33 25,39 17,45"/>
    <line class="s" x1="30" y1="45" x2="41" y2="45"/>
  </g>
</svg>
