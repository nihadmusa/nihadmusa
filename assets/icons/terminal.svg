<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="terminal">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00eaff"/><stop offset="100%" stop-color="#b14aff"/>
    </linearGradient>
    <filter id="tf" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>@keyframes fl { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2.5px) } }</style>
  </defs>
  <g style="animation:fl 3.4s ease-in-out infinite;">
    <rect x="6" y="12" width="52" height="40" rx="8" fill="none" stroke="url(#tg)" stroke-width="2.6" filter="url(#tf)"/>
    <line x1="6" y1="23" x2="58" y2="23" stroke="url(#tg)" stroke-width="1.6" opacity="0.7"/>
    <circle cx="13" cy="17.5" r="1.8" fill="#ff2bd6"/>
    <circle cx="19" cy="17.5" r="1.8" fill="#ffd166"/>
    <circle cx="25" cy="17.5" r="1.8" fill="#25ff9d"/>
    <polyline points="15,32 24,39 15,46" fill="none" stroke="#ff2bd6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#tf)"/>
    <line x1="29" y1="47" x2="42" y2="47" stroke="#00eaff" stroke-width="2.6" stroke-linecap="round" filter="url(#tf)"/>
  </g>
</svg>
