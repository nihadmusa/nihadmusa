<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="cpu">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b14aff"/><stop offset="100%" stop-color="#00eaff"/>
    </linearGradient>
    <filter id="cf" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes fl2 { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2.5px) } }
      @keyframes spin { to { transform: rotate(360deg) } }
    </style>
  </defs>
  <g style="animation:fl2 3.8s ease-in-out infinite;">
    <rect x="18" y="18" width="28" height="28" rx="6" fill="none" stroke="url(#cg)" stroke-width="2.6" filter="url(#cf)"/>
    <rect x="27" y="27" width="10" height="10" rx="2.5" fill="#ff2bd6" filter="url(#cf)"/>
    <g stroke="#00eaff" stroke-width="2.4" stroke-linecap="round">
      <line x1="25" y1="8"  x2="25" y2="17"/><line x1="32" y1="8"  x2="32" y2="17"/><line x1="39" y1="8"  x2="39" y2="17"/>
      <line x1="25" y1="47" x2="25" y2="56"/><line x1="32" y1="47" x2="32" y2="56"/><line x1="39" y1="47" x2="39" y2="56"/>
      <line x1="8"  y1="25" x2="17" y2="25"/><line x1="8"  y1="32" x2="17" y2="32"/><line x1="8"  y1="39" x2="17" y2="39"/>
      <line x1="47" y1="25" x2="56" y2="25"/><line x1="47" y1="32" x2="56" y2="32"/><line x1="47" y1="39" x2="56" y2="39"/>
    </g>
    <circle cx="32" cy="32" r="13" fill="none" stroke="#ff2bd6" stroke-width="1.3"
            stroke-dasharray="6 12" opacity="0.8" style="animation:spin 6s linear infinite; transform-origin:32px 32px;"/>
  </g>
</svg>
