<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="stack">
  <defs>
    <filter id="ig" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .s   { fill: none; stroke: #818cf8; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .dim { stroke: #6366f1; stroke-width: 1.5; stroke-linecap: round; opacity: .85; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1.6px) } }
      .g { animation: float 9.6s ease-in-out infinite; }
      @media (prefers-color-scheme: light) {
        .s { stroke: #4f46e5 } .dim { stroke: #6366f1 }
      }
      @media (prefers-reduced-motion: reduce) { .g { animation: none } }
    </style>
  </defs>
  <g class="g" filter="url(#ig)">
    <rect class="s" x="19" y="19" width="26" height="26" rx="6"/>
    <rect class="s" x="27.5" y="27.5" width="9" height="9" rx="2" stroke-width="1.4" opacity=".7"/>
    <g class="dim">
      <line x1="26" y1="10" x2="26" y2="18"/><line x1="32" y1="10" x2="32" y2="18"/><line x1="38" y1="10" x2="38" y2="18"/>
      <line x1="26" y1="46" x2="26" y2="54"/><line x1="32" y1="46" x2="32" y2="54"/><line x1="38" y1="46" x2="38" y2="54"/>
      <line x1="10" y1="26" x2="18" y2="26"/><line x1="10" y1="32" x2="18" y2="32"/><line x1="10" y1="38" x2="18" y2="38"/>
      <line x1="46" y1="26" x2="54" y2="26"/><line x1="46" y1="32" x2="54" y2="32"/><line x1="46" y1="38" x2="54" y2="38"/>
    </g>
  </g>
</svg>
