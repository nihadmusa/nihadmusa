<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="activity">
  <defs>
    <filter id="ig" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .s   { fill: none; stroke: #818cf8; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .dim { stroke: #6366f1; stroke-width: 1.6; stroke-linecap: round; opacity: .8; }
      .f   { fill: #818cf8; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1.6px) } }
      @keyframes pulse { 0%,100% { opacity: .4 } 50% { opacity: 1 } }
      .g  { animation: float 9.2s ease-in-out infinite; }
      .pt { animation: pulse 4s ease-in-out infinite; }
      @media (prefers-color-scheme: light) {
        .s { stroke: #4f46e5 } .dim { stroke: #6366f1 } .f { fill: #4f46e5 }
      }
      @media (prefers-reduced-motion: reduce) { .g, .pt { animation: none } }
    </style>
  </defs>
  <g class="g" filter="url(#ig)">
    <line class="dim" x1="10" y1="52" x2="54" y2="52"/>
    <rect class="s" x="15" y="36" width="7" height="16" rx="2.5" stroke-width="1.6" opacity=".55"/>
    <rect class="s" x="28.5" y="27" width="7" height="25" rx="2.5" stroke-width="1.6" opacity=".78"/>
    <rect class="s" x="42" y="18" width="7" height="34" rx="2.5" stroke-width="1.6"/>
    <circle class="f pt" cx="45.5" cy="12" r="2.6"/>
  </g>
</svg>
