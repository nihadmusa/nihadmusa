<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="chart">
  <defs>
    <linearGradient id="bg1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00eaff"/><stop offset="100%" stop-color="#b14aff"/>
    </linearGradient>
    <filter id="bf" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes grow { 0% { transform: scaleY(.25) } 60%,100% { transform: scaleY(1) } }
      @keyframes fl4  { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2.5px) } }
    </style>
  </defs>
  <g style="animation:fl4 3.6s ease-in-out infinite;">
    <line x1="10" y1="52" x2="54" y2="52" stroke="#4a2a8a" stroke-width="1.8" stroke-linecap="round"/>
    <g filter="url(#bf)" stroke-linecap="round">
      <rect x="14" y="36" width="8" height="16" rx="3" fill="#00eaff" style="animation:grow 3s ease-in-out infinite; transform-origin: 18px 52px;"/>
      <rect x="28" y="26" width="8" height="26" rx="3" fill="#b14aff" style="animation:grow 3s ease-in-out infinite .35s; transform-origin: 32px 52px;"/>
      <rect x="42" y="16" width="8" height="36" rx="3" fill="#ff2bd6" style="animation:grow 3s ease-in-out infinite .7s; transform-origin: 46px 52px;"/>
    </g>
    <polyline points="18,32 32,22 46,12" fill="none" stroke="#ffd166" stroke-width="1.8"
              stroke-dasharray="4 6" filter="url(#bf)"/>
    <circle cx="46" cy="12" r="3" fill="#ffd166" filter="url(#bf)">
      <animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <rect x="8" y="8" width="48" height="48" rx="12" fill="none" stroke="url(#bg1)" stroke-width="1.4" opacity="0.4"/>
  </g>
</svg>
