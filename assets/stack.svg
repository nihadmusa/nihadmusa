<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 146" width="740" height="146" role="img" aria-label="Tech stack">
  <defs>
    <radialGradient id="sHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#818cf8" stop-opacity=".16"/>
      <stop offset="55%"  stop-color="#818cf8" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <style>
      .chip  { fill: #14141f; stroke: #818cf8; stroke-opacity: .3; stroke-width: 1; }
      .label { fill: #e2e8f0; }

      @keyframes haloDrift {
        0%   { transform: translateX(-160px); }
        100% { transform: translateX(160px); }
      }
      .halo { animation: haloDrift 32s ease-in-out infinite alternate; }

      @media (prefers-color-scheme: light) {
        .chip  { fill: #ffffff; stroke: #6366f1; stroke-opacity: .38; }
        .label { fill: #1e293b; }
        .halo  { opacity: .5; }
      }

      @media (prefers-reduced-motion: reduce) { .halo { animation: none } }
    </style>
  </defs>

  <ellipse class="halo" cx="370" cy="73" rx="390" ry="130" fill="url(#sHalo)"/>

  <g font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="13" text-anchor="middle">
    <g>
      <rect class="chip" x="16"  y="10" width="132" height="34" rx="8"/><text class="label" x="82"  y="32">Java</text>
      <rect class="chip" x="160" y="10" width="132" height="34" rx="8"/><text class="label" x="226" y="32">Spring Boot</text>
      <rect class="chip" x="304" y="10" width="132" height="34" rx="8"/><text class="label" x="370" y="32">PostgreSQL</text>
      <rect class="chip" x="448" y="10" width="132" height="34" rx="8"/><text class="label" x="514" y="32">Redis</text>
      <rect class="chip" x="592" y="10" width="132" height="34" rx="8"/><text class="label" x="658" y="32">Kafka</text>
    </g>

    <g>
      <rect class="chip" x="16"  y="56" width="132" height="34" rx="8"/><text class="label" x="82"  y="78">Docker</text>
      <rect class="chip" x="160" y="56" width="132" height="34" rx="8"/><text class="label" x="226" y="78">Gradle</text>
      <rect class="chip" x="304" y="56" width="132" height="34" rx="8"/><text class="label" x="370" y="78">Spring Data</text>
      <rect class="chip" x="448" y="56" width="132" height="34" rx="8"/><text class="label" x="514" y="78">Security</text>
      <rect class="chip" x="592" y="56" width="132" height="34" rx="8"/><text class="label" x="658" y="78">JUnit</text>
    </g>

    <g>
      <rect class="chip" x="16"  y="102" width="132" height="34" rx="8"/><text class="label" x="82"  y="124">Linux</text>
      <rect class="chip" x="160" y="102" width="132" height="34" rx="8"/><text class="label" x="226" y="124">Git</text>
      <rect class="chip" x="304" y="102" width="132" height="34" rx="8"/><text class="label" x="370" y="124">REST API</text>
      <rect class="chip" x="448" y="102" width="132" height="34" rx="8"/><text class="label" x="514" y="124">CI / CD</text>
      <rect class="chip" x="592" y="102" width="132" height="34" rx="8"/><text class="label" x="658" y="124">Microservices</text>
    </g>
  </g>
</svg>
