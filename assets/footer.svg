<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 92" width="1000" height="92" role="img" aria-label="Thanks for reading">
  <defs>
    <linearGradient id="fGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8b949e" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#8b949e" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="fGlow" x="-30%" y="-400%" width="160%" height="900%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .t2 { fill: #8b949e; }
      .t3 { fill: #6e7681; }

      @keyframes grow  { 0% { transform: scaleX(.25) } 100% { transform: scaleX(1) } }
      @keyframes drift { to { stroke-dashoffset: -160; } }

      .grow { animation: grow 2.8s ease-in-out infinite alternate; transform-origin: 500px 30px; }
      .line { animation: drift 24s linear infinite; }

      @media (prefers-color-scheme: light) {
        .t2 { fill: #59636e; }
        .t3 { fill: #818b98; }
      }

      @media (prefers-reduced-motion: reduce) {
        .grow { animation: none; }
        .line { display: none; }
      }
    </style>
  </defs>

  <text x="500" y="26" text-anchor="middle"
        font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="26" font-weight="600" letter-spacing="3" class="t2">Thanks for reading</text>

  <g filter="url(#fGlow)">
    <line class="line" x1="440" y1="44" x2="560" y2="44"
          stroke="url(#fGrad)" stroke-width="1.4" stroke-dasharray="3 9"/>
    <rect class="grow" x="440" y="43" width="120" height="1.6" rx="0.8" fill="url(#fGrad)"/>
    <rect x="430" y="42" width="60" height="2.2" rx="1.1" fill="url(#fShine)">
      <animate attributeName="x" from="418" to="512" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="500" y="72" text-anchor="middle"
        font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="14" letter-spacing="2" class="t3">let_s_build_something_great();</text>
</svg>
