<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Thanks for visiting">
  <defs>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#00eaff"/>
      <stop offset="50%" stop-color="#b14aff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="txtG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#8ff6ff"/>
      <stop offset="100%" stop-color="#ffa6f0"/>
    </linearGradient>
    <filter id="wGlow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes waveMove { to { transform: translateX(-320px); } }
      @keyframes arrowBounce { 0%,100% { transform: translateY(0); opacity:.55 } 50% { transform: translateY(-6px); opacity:1 } }
      @keyframes lineGrow { 0% { transform: scaleX(.2) } 100% { transform: scaleX(1) } }
    </style>
  </defs>

  <!-- neon waves -->
  <g stroke="url(#waveGrad)" fill="none" stroke-width="2" filter="url(#wGlow)" opacity="0.75">
    <path d="M0 24 q40 -18 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <path d="M0 128 q40 18 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="160 0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="500" y="72" text-anchor="middle" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif"
        font-size="40" font-weight="800" letter-spacing="5" fill="url(#txtG)" filter="url(#wGlow)">
    THANKS FOR STOPPING BY
  </text>

  <rect x="250" y="92" width="500" height="2.4" rx="1.2" fill="url(#waveGrad)" filter="url(#wGlow)"
        style="animation:lineGrow 2.4s ease-in-out infinite alternate; transform-origin: 500px 93px;"/>

  <text x="500" y="118" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="15" letter-spacing="3" fill="#a98fd6">&gt; let_s_build_something_great();</text>

  <g style="animation:arrowBounce 1.6s ease-in-out infinite;">
    <text x="500" y="146" text-anchor="middle" font-size="18" fill="#ff2bd6">&#9660;</text>
  </g>
</svg>
