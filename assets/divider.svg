<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 56" width="1000" height="56" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00eaff" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#00eaff" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#b14aff" stop-opacity="1"/>
      <stop offset="82%"  stop-color="#ff2bd6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0"/>
    </linearGradient>
    <filter id="dGlow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes dashMove { to { stroke-dashoffset: -120; } }
      @keyframes spin     { to { transform: rotate(360deg); } }
      @keyframes breathe2 { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    </style>
  </defs>

  <line x1="0" y1="28" x2="1000" y2="28" stroke="url(#dg)" stroke-width="1.6"
        stroke-dasharray="10 14" filter="url(#dGlow)"
        style="animation:dashMove 2.2s linear infinite;"/>

  <line x1="60" y1="28" x2="470" y2="28" stroke="url(#dg)" stroke-width="2.6" opacity="0.35"
        style="animation:dashMove 2.2s linear infinite;"/>
  <line x1="530" y1="28" x2="940" y2="28" stroke="url(#dg)" stroke-width="2.6" opacity="0.35"
        style="animation:dashMove 2.2s linear infinite;"/>

  <g transform="translate(500 28)" filter="url(#dGlow)" style="animation:spin 9s linear infinite; transform-origin: 500px 28px;">
    <rect x="-13" y="-13" width="26" height="26" rx="4" fill="none" stroke="#ff2bd6" stroke-width="2"/>
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#00eaff" style="animation:breathe2 1.8s ease-in-out infinite;"/>
  </g>

  <circle cx="452" cy="28" r="2.6" fill="#00eaff" filter="url(#dGlow)" style="animation:breathe2 1.4s ease-in-out infinite;"/>
  <circle cx="548" cy="28" r="2.6" fill="#ff2bd6" filter="url(#dGlow)" style="animation:breathe2 1.4s ease-in-out infinite .7s;"/>
</svg>
