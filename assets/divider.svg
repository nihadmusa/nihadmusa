<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 36" width="1000" height="36" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#818cf8" stop-opacity=".32"/>
      <stop offset="50%"  stop-color="#c7d2fe" stop-opacity=".85"/>
      <stop offset="78%"  stop-color="#818cf8" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <filter id="dGlow" x="-30%" y="-500%" width="160%" height="1100%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes drift { to { stroke-dashoffset: -140; } }
      @keyframes gem  { 0%,100% { opacity: .5 } 50% { opacity: 1 } }

      .line { animation: drift 30s linear infinite; }
      .gem  { animation: gem 6s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .line, .gem { animation: none; }
      }
    </style>
  </defs>

  <line class="line" x1="0" y1="18" x2="1000" y2="18"
        stroke="url(#dGrad)" stroke-width="1.3" stroke-dasharray="2 12" filter="url(#dGlow)"/>

  <g transform="translate(500 18)">
    <rect class="gem" x="-4" y="-4" width="8" height="8" rx="1.2"
          fill="none" stroke="#818cf8" stroke-width="1.3" stroke-opacity=".7"/>
  </g>
</svg>
