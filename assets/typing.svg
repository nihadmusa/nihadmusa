<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 46" width="540" height="46" role="img" aria-label="Role typing animation">
  <defs>
    <filter id="tglow" x="-20%" y="-120%" width="140%" height="340%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .bg   { fill: #0d1117; }
      .bd   { fill: none; stroke: #21262d; stroke-width: 1.1; }
      .t1   { fill: #e6edf3; }
      .t2   { fill: #8b949e; }
      .t3   { fill: #6e7681; }

      @keyframes line {
        0%     { opacity: 0; }
        1.5%   { opacity: 1; }
        23.5%  { opacity: 1; }
        25%    { opacity: 0; }
        100%   { opacity: 0; }
      }
      @keyframes blink { 0%,55% { opacity: 1 } 56%,100% { opacity: 0 } }

      .ln  { animation: line 16s linear infinite; }
      .cur { animation: blink 1.4s step-end infinite; }

      @media (prefers-color-scheme: light) {
        .bg  { fill: #ffffff; }
        .bd  { stroke: #d0d7de; }
        .t1  { fill: #1f2328; }
        .t2  { fill: #59636e; }
        .t3  { fill: #818b98; }
      }

      @media (prefers-reduced-motion: reduce) {
        .ln  { animation: none; opacity: 0; }
        .ln:first-of-type { opacity: 1; }
        .cur { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect class="bg" width="540" height="46" rx="10"/>
  <rect class="bd" x="0.55" y="0.55" width="538.9" height="44.9" rx="10"/>

  <text x="16" y="31" font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="19" class="t3">&gt;</text>

  <g font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="19" font-weight="600" filter="url(#tglow)">

    <g class="ln">
      <text x="36" y="31" class="t1">Java Backend Developer</text>
      <rect x="304" y="14" width="10" height="20" class="t1 cur" style="animation-delay:.2s"/>
    </g>

    <g class="ln" style="animation-delay:4s">
      <text x="36" y="31" class="t1">Spring Boot &amp; Microservices</text>
      <rect x="350" y="14" width="10" height="20" class="t1 cur" style="animation-delay:.7s"/>
    </g>

    <g class="ln" style="animation-delay:8s">
      <text x="36" y="31" class="t1">Distributed systems enthusiast</text>
      <rect x="372" y="14" width="10" height="20" class="t1 cur" style="animation-delay:1.1s"/>
    </g>

    <g class="ln" style="animation-delay:12s">
      <text x="36" y="31" class="t1">Clean code, fast delivery</text>
      <rect x="327" y="14" width="10" height="20" class="t1 cur" style="animation-delay:.4s"/>
    </g>
  </g>
</svg>
