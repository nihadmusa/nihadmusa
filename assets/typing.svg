<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 46" width="560" height="46" role="img" aria-label="Role typing animation">
  <defs>
    <filter id="tglow" x="-20%" y="-120%" width="140%" height="340%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .bg   { fill: #0d0d14; }
      .bd   { fill: none; stroke: #818cf8; stroke-opacity: .28; stroke-width: 1.1; }
      .t1   { fill: #f1f5f9; }
      .acc  { fill: #818cf8; }

      @keyframes line {
        0%     { opacity: 0; }
        1.5%   { opacity: 1; }
        23.5%  { opacity: 1; }
        25%    { opacity: 0; }
        100%   { opacity: 0; }
      }
      @keyframes blink { 0%,55% { opacity: 1 } 56%,100% { opacity: 0 } }

      .ln  { animation: line 18s linear infinite; }
      .cur { animation: blink 1.5s step-end infinite; }

      @media (prefers-color-scheme: light) {
        .bg  { fill: #ffffff; }
        .bd  { stroke: #6366f1; stroke-opacity: .32; }
        .t1  { fill: #0f172a; }
        .acc { fill: #4f46e5; }
      }

      @media (prefers-reduced-motion: reduce) {
        .ln  { animation: none; opacity: 0; }
        .ln:first-of-type { opacity: 1; }
        .cur { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect class="bg" width="560" height="46" rx="10"/>
  <rect class="bd" x="0.55" y="0.55" width="558.9" height="44.9" rx="10"/>

  <text x="16" y="31" font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="19" class="acc">&gt;</text>

  <g font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="19" font-weight="600" filter="url(#tglow)">

    <g class="ln">
      <text x="36" y="31" class="t1">Software Developer</text>
      <rect x="247" y="14" width="10" height="20" class="acc cur" style="animation-delay:.2s"/>
    </g>

    <g class="ln" style="animation-delay:4.5s">
      <text x="36" y="31" class="t1">Backend &amp; APIs</text>
      <rect x="213" y="14" width="10" height="20" class="acc cur" style="animation-delay:.7s"/>
    </g>

    <g class="ln" style="animation-delay:9s">
      <text x="36" y="31" class="t1">Distributed systems enthusiast</text>
      <rect x="372" y="14" width="10" height="20" class="acc cur" style="animation-delay:1.1s"/>
    </g>

    <g class="ln" style="animation-delay:13.5s">
      <text x="36" y="31" class="t1">Clean code, fast delivery</text>
      <rect x="327" y="14" width="10" height="20" class="acc cur" style="animation-delay:.4s"/>
    </g>
  </g>
</svg>
